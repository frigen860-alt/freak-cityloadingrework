<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freak-City — Загрузка</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen" aria-label="Экран загрузки Freak-City">
    <div class="vignette"></div>
    <div class="grain"></div>

    <section class="music-player" aria-label="Музыкальный плеер">
      <div class="music-header">
        <div>
          <span class="eyebrow">СЕЙЧАС ИГРАЕТ</span>
          <strong id="trackTitle">Музыка сервера</strong>
          <span id="trackArtist" class="artist">Freak-City</span>
        </div>
        <span class="music-note" aria-hidden="true">♫</span>
      </div>

      <input id="seek" class="seek" type="range" min="0" max="100" value="0" aria-label="Перемотка" />

      <div class="time-row">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>

      <div class="controls">
        <button id="muteBtn" class="icon-btn" type="button" aria-label="Включить или выключить звук">🔊</button>
        <button id="playBtn" class="play-btn" type="button" aria-label="Воспроизвести музыку">▶</button>
        <label class="volume-wrap" aria-label="Громкость">
          <span>Громкость</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.45" />
        </label>
      </div>

      <audio id="music" preload="metadata" loop>
        <source src="music/music.mp3" type="audio/mpeg" />
        Ваш браузер не поддерживает аудио.
      </audio>
    </section>

    <section class="center-content">
      <img class="logo" src="assets/logo.png" alt="Freak-City" />
    </section>

    <section class="loading-panel" aria-live="polite">
      <div class="loading-title">ЗАГРУЗКА...</div>

      <div class="download-row">
        <span class="label">СКАЧИВАЕТСЯ:</span>
        <span id="downloadFile" class="file-name">Подготовка файлов сервера...</span>
        <span id="progressText" class="progress-text">0%</span>
      </div>

      <div class="progress-shell">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="status-row">
        <span id="statusText">Подключение к серверу...</span>
        <span id="serverName">Freak-City</span>
      </div>
    </section>

    <footer class="tip">
      <span class="bulb">💡</span>
      <strong>СОВЕТ:</strong>
      <span id="tipText">Не забывайте читать правила сервера и уважать других игроков.</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
