<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LOL City Loading</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #loading-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
    </style>
</head>
<body>
    <video
        id="loading-video"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
    >
        <source src="0801.webm" type="video/webm">
        <source src="0801.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("loading-video");

        async function startVideo() {
            video.muted = true;

            try {
                await video.play();

                setTimeout(() => {
                    video.volume = 1;
                    video.muted = false;
                }, 500);
            } catch (_) {
                video.muted = true;
                video.play().catch(() => {});
            }
        }

        window.addEventListener("load", startVideo);
        video.addEventListener("canplay", startVideo);

        setInterval(() => {
            if (video.paused) {
                startVideo();
            }
        }, 1000);
    </script>
</body>
</html>
